# PEP 621 Ref: https://packaging.python.org/en/latest/specifications/pyproject-toml/
[project]
name = "apple-wallet-pass"
version = "0.1.0"
description = "Python package to create passes compatible with Apple Wallet. (forked from Primedigital Global)"
authors = [{ name = "Loic Tosser", email = "loic@kalvad.com" }]
license = "MIT"

readme = "README.md"
requires-python = ">=3.11"

keywords = ["apple pass", "apple wallet", "passbook", "apple_wallet_pass"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]

# cryptography >= 40 blocks SHA1 in its PKCS7 builder, which Apple mandates;
# signing is done via manual CMS construction (asn1crypto) instead.
dependencies = ["asn1crypto>=1.5.1", "cryptography>=48.0.0"]

[project.urls]
Repository = "https://github.com/KalvadTech/apple-wallet-pass"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8.1,<0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
